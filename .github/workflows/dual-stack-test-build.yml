name: Dual-stack macOS test build

on:
  push:
    branches: [fix/arm64-dual-stack-dial]

permissions:
  contents: read

concurrency:
  group: dual-stack-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'jpskidmore/jps-telephone'
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install verification prerequisite
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
      - name: Validate, build, sign and verify
        shell: bash
        run: |
          set -euo pipefail
          export JPS_LOCAL_BUILD_DIR="${RUNNER_TEMP}/jps-dual-stack"
          ./Scripts/build-test-release.sh 2>&1 | tee "${RUNNER_TEMP}/jps-dual-stack.log"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dual-stack-validation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/jps-dual-stack/*.xcresult
            ${{ runner.temp }}/jps-dual-stack.log
          retention-days: 5
      - name: Upload verified test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dual-stack-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/jps-dual-stack/distribution/
          if-no-files-found: error
          retention-days: 5
